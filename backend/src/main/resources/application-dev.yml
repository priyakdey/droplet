spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      username: droplet_user
      password: droplet_password
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: http://localhost:8080/api/auth/google/callback
          github:
            redirect-uri: http://localhost:8080/api/auth/github/callback
  cloud:
    azure:
      storage:
        blob:
          account-name: devstoreaccount1
          account-key: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
          endpoint: http://localhost:10000/${spring.cloud.azure.storage.blob.account-name}
          client:
            application-id: ${spring.application.name}-${spring.profiles.active}-${instance-id}

token:
  state:
    ttl: 5
    providers:
      google:
        secret: ${GOOGLE_STATE_SECRET}
        issuer: droplet-oauth
        expiration-in-sec: 300
        leeway-in-sec: 10
      github:
        secret: ${GITHUB_STATE_SECRET}
        issuer: droplet-oauth
        expiration-in-sec: 300
        leeway-in-sec: 10
  jwt:
    secret: ${JWT_SESSION_SECRET}
    issuer: droplet
    expiration-in-sec: 3600
    leeway-in-sec: 30

app:
  cors:
    allowed-origins:
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

frontend:
  base-url: http://localhost:5173